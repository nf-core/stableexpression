[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "tests"]

[tool.ruff.lint]
select = ["ALL"]  # all coding rules; rule showing conflicts are deactivated
ignore = ["E501"] # Avoid enforcing line-length violations (`E501`)

[tool.ruff.format]
quote-style = "double" # Use single quotes when formatting.
indent-style = "space"

docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["common", "config"]
