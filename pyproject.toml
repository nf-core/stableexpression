[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", "tests"]

[tool.ruff.lint]
select = ["ALL"]  # all coding rules; rule showing conflicts are deactivated
ignore = ["E501", "S311", "G004", "PTH123", "EM101", "FURB122"]

[tool.ruff.format]
quote-style = "double" # Use single quotes when formatting.
indent-style = "space"

docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["common", "config"]
