lint:
  container_configs: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - assets/nf-core-stableexpression_logo_light.png
    - docs/images/nf-core-stableexpression_logo_light.png
    - docs/images/nf-core-stableexpression_logo_dark.png
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
  nextflow_config:
    - params.input
  template_strings:
    - tests/test_data/modules/genorm/compute_m_measure/input/std.1.2.parquet
nf_core_version: 4.1.0
repository_type: pipeline
template:
  author: Olivier Coen
  description: This pipeline is dedicated to identifying the most stable genes within
    a single or multiple expression dataset(s). This is particularly useful for identifying
    the most suitable RT-qPCR reference genes for a specific species.
  force: false
  is_nfcore: true
  name: stableexpression
  org: nf-core
  outdir: .
  skip_features:
    - igenomes
    - fastqc
  version: 1.0.0
