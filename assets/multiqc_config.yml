  skewness:
    section_name: "Count skewness"
    parent_id: stats
    parent_name: "Statistics"
    parent_description: "Various statistics at the gene or sample level"
    file_format: "csv"
    pconfig:
      sort_samples: false
      #xmin: 0
      #xmax: 1
      xlab: Skewness
      ylab: Dataset
    description: |
      Distribution of count skewness across samples, displayed dataset per dataset.
    plot_type: "boxplot"

  ratio_zeros:
    section_name: "Proportion of zeros"
    parent_id: stats
    parent_name: "Statistics"
    parent_description: "Various statistics at the gene or sample level"
    file_format: "csv"
    pconfig:
      sort_samples: false
      #xmin: 0
      #xmax: 1
      xlab: Proportion of zeros
      ylab: Dataset
    description: |
      Distribution of zeros across samples, displayed dataset per dataset.
    plot_type: "boxplot"

  ratio_nulls:
    section_name: "Proportion of missing values"
    parent_id: stats
    parent_name: "Statistics"
    parent_description: "Various statistics at the gene or sample level"
    file_format: "csv"
    pconfig:
      sort_samples: false
      #xmin: 0
      #xmax: 1
      xlab: Proportion of null values
      ylab: Dataset
    description: |
      Distribution of missing values (including genes not present) across samples, displayed dataset per dataset.
    plot_type: "boxplot"

  null_values_filter:
    section_name: "Filter on null values"
    parent_id: filtering
    parent_name: "Sample filtering"
    parent_description: "Proportion of samples filtered out, relatively to the the variable observed"
    file_format: "csv"
    pconfig:
      sort_samples: true
      tt_decimals: 0
      cpswitch: false # show the 'Counts / Percentages' switch
      cpswitch_c_active: true # show counts per default
      stacking: "relative"
    description: |
      Effect of filter on ratio of null (missing) values
    categories:
      kept:
        name: "Nb samples kept"
        color: "#2ABF96"
      rejected:
        name: "Nb samples rejected"
        color: "#38B4F2"
    plot_type: "barplot"

  zero_values_filter:
    section_name: "Filter on zero values"
    parent_id: filtering
    parent_name: "Sample filtering"
    parent_description: "Proportion of samples filtered out, relatively to the the variable observed"
    file_format: "csv"
    pconfig:
      sort_samples: true
      tt_decimals: 0
      cpswitch: false # show the 'Counts / Percentages' switch
      cpswitch_c_active: true # show counts per default
      stacking: "relative"
    description: |
      Effect of filter on ratio of zero values
    categories:
      kept:
        name: "Nb samples kept"
        color: "#2ABF96"
      rejected:
        name: "Nb samples rejected"
        color: "#38B4F2"
    plot_type: "barplot"

  id_mapping_stats:
    section_name: "Gene ID mapping statistics"
    parent_id: idmapping
    parent_name: "ID mapping"
    parent_description: "Information about the ID mapping"
    file_format: "csv"
    pconfig:
      sort_samples: true
      tt_decimals: 0
      cpswitch: true # show the 'Counts / Percentages' switch
      cpswitch_c_active: true # show counts per default
      stacking: "relative"
    description: |
      Statistics of gene ID mapping, dataset per dataset
    categories:
      final:
        name: "Nb final gene IDs"
        color: "#2ABF96"
      merged:
        name: "Nb gene IDs merged with other IDs"
        color: "#38B4F2"
      not_valid:
        name: "Nb rare gene IDs removed"
        color: "#F2C038"
      unmapped:
        name: "Nb unmapped gene IDs"
        color: "#E3224A"
    plot_type: "barplot"

  total_gene_id_occurrence_quantiles:
    section_name: "Distribution of gene ID occurrence quantiles"
    parent_id: idmapping
    parent_name: "ID mapping"
    parent_description: "Information about the ID mapping"
    file_format: "csv"
    pconfig:
      categories: true
    #ymax: 1.1
    #ymin: -0.1
    #y_lines:
    #  - value: 1
    #    color: "#ff0000"
    #    width: 2
    #   dash: "dash"
    #   label: "Threshold"
    description: |
      Quantiles of the total number of occurrences of gene IDs across all datasets. Quantile values were sorted from greatest to least.
    plot_type: "linegraph"
    helptext: |
      Gene IDs can be present or absent in the datasets. For each gene ID, the total number of occurrences across all datasets was calculated and quantile values were computed from these totals.

  eatlas_selected_experiments_metadata:
