report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/stableexpression/tree/dev" target="_blank">nf-core/stableexpression</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/stableexpression/dev/docs/output" target="_blank">documentation</a>.

report_section_order:
  "nf-core-stableexpression-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-stableexpression-summary":
    order: -1002

export_plots: true

run_modules:
  - custom_content

disable_version_detection: true

max_table_rows: 5000

table_cond_formatting_colours:
  - first: "#ffd700"
  - second: "#C0C0C0"
  - third: "#CD7F32"
  - between_fourth_and_tenth: "#468F8F"
  - very_low: "#337ab7"
  - low: "#5bc0de"
  - medium: "#5cb85c"
  - high: "#f0ad4e"
  - very_high: "#d9534f"

custom_data:
  ranked_top_stable_genes_summary:
    section_name: "Top stable genes - ranked by stability"
    file_format: "csv"
    no_violin: true
    #sort_rows: false
    description: |
      Expression descriptive statistics of all genes, ranked by stability.
      Expression was first normalised dataset per dataset, then log2(cpm + 1) transformed (cpm :counts per million) and finally fitted to [0, 1] using quantile normalisation.
      Genes are sorted by stability score - from the most stable to the least stable.
    plot_type: "table"
    pconfig:
      col1_header: "Ensembl Gene ID"
      sort_rows: false
    headers:
      ensembl_gene_id:
        title: "Ensembl Gene ID"
        description: |
          Gene IDs as shown in Ensembl
      rank:
        title: "Rank"
        description: |
          Rank of the gene based on stability score
        cond_formatting_rules:
          between_fourth_and_tenth:
            - eq: 4
            - eq: 5
            - eq: 6
            - eq: 7
            - eq: 8
            - eq: 9
            - eq: 10
          third:
            - eq: 3
          second:
            - eq: 2
          first:
            - eq: 1
      stability_score:
        title: "Stability score"
        description: |
          Final stability score : the lower, the better
        format: "{:,.6f}"
        scale: "RdYlGn-rev"
      variation_coefficient_normalised:
        title: "Normalised coefficient of variation"
        description: |
          Quantile normalised (among candidate genes) coefficient of variation ( std(expression) / mean(expression) ) across all samples.
        format: "{:,.6f}"
        scale: "PRGn-rev"
      normfinder_stability_value_normalised:
        title: "Normalised Normfinder stability value "
        description: |
          Quantile normalised (among candidate genes) stability value as computed by Normfinder
        format: "{:,.6f}"
        scale: "PRGn-rev"
      genorm_m_measure_normalised:
        title: "Normalised Genorm M-measure"
        description: |
          Quantile normalised (among candidate genes) M-measure as computed by Genorm
        format: "{:,.6f}"
        scale: "PRGn-rev"
      median_absolute_deviation_normalised:
        title: "Normalised median absolute deviation"
        description: |
          Quantile normalised (among candidate genes) median absolute deviation of the expression across all samples.
        format: "{:,.4f}"
        scale: "PRGn-rev"
      standard_deviation:
        title: "Standard deviation"
        description: |
          Standard deviation of the expression across all samples.
        format: "{:,.6f}"
      variation_coefficient:
        title: "Coefficient of variation"
        description: |
          Variation coefficient ( std(expression) / mean(expression) ) across all samples.
        format: "{:,.6f}"
      normfinder_stability_value:
        title: "Normfinder stability value "
        description: |
          Stability value as computed by Normfinder
        format: "{:,.6f}"
      genorm_m_measure:
        title: "Genorm M-measure"
        description: |
          M-measure as computed by Genorm
        format: "{:,.6f}"
      mean:
        title: "Average"
        description: |
          Average expression across all samples.
        format: "{:,.4f}"
      median:
        title: "Median"
        description: |
          Median expression across all samples.
        format: "{:,.4f}"
      median_absolute_deviation:
        title: "Median absolute deviation"
        description: |
          Median absolute deviation of the expression across all samples.
        format: "{:,.4f}"
      expression_level_status:
        title: "Expression level"
        description: |
          Indication about the average gene expression level across all samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      name:
        title: "Ensembl name"
        description: |
          Gene name as shown in Ensembl (g:Profiler)
      description:
        title: "Ensembl description"
        description: |
          Gene description as shown in Ensembl (g:Profiler)
      original_gene_ids:
        title: "Original gene IDs"
        description: |
          Original gene IDs as stated in the input (provided or downloaded) datasets
      rnaseq_standard_deviation:
        title: "Std [RNA-seq only]"
        description: |
          Standard deviation of the expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_variation_coefficient:
        title: "Var coeff [RNA-seq only]"
        description: |
          Variation coefficient ( std(expression) / mean(expression) ) across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_mean:
        title: "Average [RNA-seq only]"
        description: |
          Average expression across samples.
        format: "{:,.4f}"
      rnaseq_median:
        title: "Median [RNA-seq only]"
        description: |
          Median expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_median_absolute_deviation:
        title: "Mad [RNA-seq only]"
        description: |
          Median absolute deviation of the expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_expression_level_status:
        title: "Expression level [RNA-seq only]"
        description: |
          Indication about the average gene expression level across RNA-Seq samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      microarray_standard_deviation:
        title: "Std [Microarray only]"
        description: |
          Standard deviation of the expression across Microarray samples.
        format: "{:,.4f}"
      microarray_variation_coefficient:
        title: "Var coeff [Microarray only]"
        description: |
          Variation coefficient ( std(expression) / mean(expression) ) across Microarray samples.
        format: "{:,.4f}"
      microarray_mean:
        title: "Average [Microarray only]"
        description: |
          Average expression across Microarray samples.
        format: "{:,.4f}"
      microarray_median:
        title: "Median [Microarray only]"
        description: |
          Median expression across Microarray samples.
        format: "{:,.4f}"
      microarray_median_absolute_deviation:
        title: "Mad [Microarray only]"
        description: |
          Median absolute deviation of the expression across Microarray samples.
        format: "{:,.4f}"
      microarray_expression_level_status:
        title: "Expression level [Microarray only]"
        description: |
          Indication about the average gene expression level across Microarray samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples)"
        description: |
          Ratio of samples in which the gene is not represented.
      ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples)"
        description: |
          Ratio of samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      ratio_zeros:
        title: "Ratio zero values"
        description: |
          Ratio of samples in which the gene has a zero value.
      rnaseq_ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples) [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene is not represented.
      rnaseq_ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples) [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      rnaseq_ratio_zeros:
        title: "Ratio zero values [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene has a zero value.
      microarray_ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples) [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene is not represented.
      microarray_ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples) [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      microarray_ratio_zeros:
        title: "Ratio zero values [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene has a zero value.

  expression_distributions_top_stable_genes:
    section_name: "Expression distribution of the top stable genes (ranked by stability)"
    file_format: "csv"
    pconfig:
      sort_samples: false
    description: |
      Distribution of gene expression across samples for the most stable genes.

      Genes are ranked from the most stable to the least stable.
    plot_type: "boxplot"
    #xlab: Expression
    #ylab: Gene

  gene_statistics:
    section_name: "Descriptive statistics - All genes"
    file_format: "csv"
    description: |
      Distribution of descriptive statistics for all genes.
      Expression was first computed as log2(cpm + 1), then fitted to [0, 1] using scikit-learn's QuantileTransformer.
    plot_type: "violin"
    pconfig:
      col1_header: "Ensembl Gene ID"
    headers:
      # colors from https://colorbrewer2.org/#type=diverging&scheme=BrBG&n=8
      standard_deviation:
        title: "Standard deviation"
        description: |
          Standard deviation of the expression across samples
        color: "#bf812d"
      variation_coefficient:
        title: "Coefficient of variation"
        description: |
          Coefficient of variation (ratio of standard deviation to mean)
        color: "#f6e8c3"
      mean:
        title: "Average"
        description: |
          Average expression across samples.
          Expression was first computed as log2(cpm + 1), then fitted to [0, 1] using scikit-learn's QuantileTransformer.
        color: "#01665e"
      normfinder_stability_value:
        title: "Normfinder stability value "
        description: |
          Stability value as computed by Normfinder
        color: "#01665e"
      genorm_m_measure:
        title: "Genorm M-measure"
        description: |
          M-measure as computed by Genorm
        color: "#01665e"

  gene_counts:
    section_name: "Gene counts"
    file_format: "csv"
    description: |
      Distribution of gene counts across samples.
    plot_type: "linegraph"
    pconfig:
      categories: true
    headers:
      count:
        title: "Gene count"
        description: |
          Number of genes included in the dataset after normalisation
        color: "#bf812d"

  skewness:
    section_name: "Skewness"
    file_format: "csv"
    description: |
      Distribution of expression skewness across samples.
    plot_type: "linegraph"
    pconfig:
      categories: true
    headers:
      skewness:
        title: "Skewness"
        description: |
          Skewness of the distribution of the normalised expression
        color: "#bf812d"

  uniform_distribution_probabilities:
    section_name: "Probabilities of normal / uniform count distribution"
    file_format: "csv"
    description: |
      Pvalue of Kolmogorov-Smirnov test to normal / uniform distribution.
      The higher the pvalue, the more likely the distribution is normal / uniform.
      If the pvalue < 0.05, the null hypothesis is rejected and the distribution is not normal / uniform.
      Samples showing a pvalue lower than the threshold (set in parameters) when not considered for stability scoring.
    plot_type: "linegraph"
    pconfig:
      categories: true
      logswitch: true
      logswitch_active: true
      logswitch_label: "Log10"
    headers:
      kolmogorov_smirnov_pvalue:
        title: "KS test to normal / uniform distribution - pvalue"
        description: |
          Pvalue of Kolmogorov-Smirnov test to normal / uniform distribution.
        color: "#bf812d"

  eatlas_filtered_experiments_metadata:
    section_name: "Expression Atlas metadata - filtered"
    file_format: "tsv"
    no_violin: true
    sort_rows: false
    description: |
      Metadata of Expression Atlas accessions filtered relatively to the provided species (and optionally the provided keywords)
    plot_type: "table"

  eatlas_all_experiments_metadata:
    section_name: "Expression Atlas metadata - all"
    file_format: "tsv"
    no_violin: true
    sort_rows: false
    description: |
      Metadata of Expression Atlas accessions filtered relatively to the provided species (and optionally the provided keywords)
    plot_type: "table"

#violin_downsample_after: 10000

log_filesize_limit: 10000000000 # 10GB

sp:
  ranked_top_stable_genes_summary:
    fn: "*top_stable_genes_summary.csv"
    max_filesize: 5000000 # 5MB
  expression_distributions_top_stable_genes:
    fn: "*top_stable_genes_transposed_counts*.csv"
    max_filesize: 50000000 # 50MB
  gene_statistics:
    fn: "*stats_all_genes.csv"
    max_filesize: 50000000 # 50MB
  gene_counts:
    fn: "*gene_count_statistics.csv"
  skewness:
    fn: "*skewness_statistics.csv"
  uniform_distribution_probabilities:
    fn: "*ks_test_statistics.csv"
  eatlas_filtered_experiments_metadata:
    fn: "*filtered_experiments.metadata.tsv"
  eatlas_all_experiments_metadata:
    fn: "*all_experiments.metadata.tsv"
