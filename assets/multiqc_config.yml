      Reasons of failure during Normalisation (DESeq2 or edgeR)
    plot_type: "table"

  normalisation_warning_reasons:
    section_name: "Warning reasons"
    parent_id: normalisation
    parent_name: "Normalisation"
    parent_description: "Information about the normalisation"
    file_format: "tsv"
    no_violin: true
    description: |
      Reasons of failure during Normalisation (DESeq2 or edgeR)
    plot_type: "table"

