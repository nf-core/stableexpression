report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/stableexpression/tree/dev" target="_blank">nf-core/stableexpression</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/stableexpression/dev/docs/output" target="_blank">documentation</a>.

report_section_order:
  "nf-core-stableexpression-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-stableexpression-summary":
    order: -1002

export_plots: true

run_modules:
  - custom_content

disable_version_detection: true

max_table_rows: 5000

table_cond_formatting_colours:
  - first: "#ffd700"
  - second: "#C0C0C0"
  - third: "#CD7F32"
  - between_fourth_and_tenth: "#468F8F"
  - very_low: "#337ab7"
  - low: "#5bc0de"
  - medium: "#5cb85c"
  - high: "#f0ad4e"
  - very_high: "#d9534f"

custom_data:
  ranked_most_stable_genes_summary:
    section_name: "Stable genes ranking"
    file_format: "csv"
    no_violin: true
    description: |
      Expression descriptive statistics of all genes, ranked by stability.
      Genes are sorted by stability score - from the most stable to the least stable.
    plot_type: "table"
    pconfig:
      col1_header: "Gene ID"
      sort_rows: false
    headers:
      gene_id:
        title: "Gene ID"
      rank:
        title: "Rank"
        description: |
          Rank of the gene based on stability score
        scale: "RdYlGn-rev"
        cond_formatting_rules:
          between_fourth_and_tenth:
            - eq: 4
            - eq: 5
            - eq: 6
            - eq: 7
            - eq: 8
            - eq: 9
            - eq: 10
          third:
            - eq: 3
          second:
            - eq: 2
          first:
            - eq: 1
      name:
        title: "Gene name"
      description:
        title: "Gene description"
      original_gene_ids:
        title: "Original gene IDs"
        description: |
          Original gene IDs as stated in the input (provided or downloaded) datasets
      stability_score:
        title: "Stability score"
        description: |
          Final stability score : the lower, the better
        format: "{:,.6f}"
        scale: "RdYlGn-rev"
      coefficient_of_variation_normalised:
        title: "Normalised CV"
        description: |
          Quantile normalised (among candidate genes) coefficient of variation ( std(expression) / mean(expression) ) across all samples.
        format: "{:,.6f}"
        scale: "PRGn-rev"
      robust_coefficient_of_variation_median_normalised:
        title: "Normalised RCVm"
        description: |
          Quantile normalised (among candidate genes) robust coefficient of variation on median of the expression across all samples.
        format: "{:,.4f}"
        scale: "PRGn-rev"
      normfinder_stability_value_normalised:
        title: "Normalised Normfinder score"
        description: |
          Quantile normalised (among candidate genes) stability value as computed by Normfinder
        format: "{:,.6f}"
        scale: "PRGn-rev"
      genorm_m_measure_normalised:
        title: "Normalised Genorm score"
        description: |
          Quantile normalised (among candidate genes) M-measure as computed by Genorm
        format: "{:,.6f}"
        scale: "PRGn-rev"
      coefficient_of_variation:
        title: "CV"
        description: |
          Coefficient of variation ( std(expression) / mean(expression) ) across all samples.
        format: "{:,.6f}"
      robust_coefficient_of_variation_median:
        title: "RCVm"
        description: |
          Robust coefficient of variation on median of the expression across all samples.
        format: "{:,.4f}"
      normfinder_stability_value:
        title: "Normfinder stability value "
        description: |
          Stability value as computed by Normfinder
        format: "{:,.6f}"
      genorm_m_measure:
        title: "Genorm M-measure"
        description: |
          M-measure as computed by Genorm
        format: "{:,.6f}"
      mean:
        title: "Average"
        description: |
          Average expression across all samples.
        format: "{:,.4f}"
      standard_deviation:
        title: "Standard deviation"
        description: |
          Standard deviation of the expression across all samples.
        format: "{:,.6f}"
      median:
        title: "Median"
        description: |
          Median expression across all samples.
        format: "{:,.4f}"
      median_absolute_deviation:
        title: "MAD"
        description: |
          Median absolute deviation of the expression across all samples.
        format: "{:,.4f}"
      expression_level_status:
        title: "Expression level"
        description: |
          Indication about the average gene expression level across all samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      rnaseq_coefficient_of_variation:
        title: "Var coeff [RNA-seq only]"
        description: |
          Coefficient of variation ( std(expression) / mean(expression) ) across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_robust_coefficient_of_variation_median:
        title: "RCVm [RNA-seq only]"
        description: |
          Robust coefficient of variation on median of the expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_mean:
        title: "Average [RNA-seq only]"
        description: |
          Average expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_standard_deviation:
        title: "Std [RNA-seq only]"
        description: |
          Standard deviation of the expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_median:
        title: "Median [RNA-seq only]"
        description: |
          Median expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_median_absolute_deviation:
        title: "MAD [RNA-seq only]"
        description: |
          Median absolute deviation of the expression across RNA-Seq samples.
        format: "{:,.4f}"
      rnaseq_expression_level_status:
        title: "Expression level [RNA-seq only]"
        description: |
          Indication about the average gene expression level across RNA-Seq samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      microarray_coefficient_of_variation:
        title: "Var coeff [Microarray only]"
        description: |
          Coefficient of variation ( std(expression) / mean(expression) ) across Microarray samples.
        format: "{:,.4f}"
      microarray_robust_coefficient_of_variation_median:
        title: "RCVm [Microarray only]"
        description: |
          Robust coefficient of variation on median of the expression across Microarray samples.
        format: "{:,.4f}"
      microarray_mean:
        title: "Average [Microarray only]"
        description: |
          Average expression across Microarray samples.
        format: "{:,.4f}"
      microarray_standard_deviation:
        title: "Std [Microarray only]"
        description: |
          Standard deviation of the expression across Microarray samples.
        format: "{:,.4f}"
      microarray_median:
        title: "Median [Microarray only]"
        description: |
          Median expression across Microarray samples.
        format: "{:,.4f}"
      microarray_median_absolute_deviation:
        title: "MAD [Microarray only]"
        description: |
          Median absolute deviation of the expression across Microarray samples.
        format: "{:,.4f}"
      microarray_expression_level_status:
        title: "Expression level [Microarray only]"
        description: |
          Indication about the average gene expression level across Microarray samples (compared to the whole pool of genes).
          Expression in [0, 0.05]: Very low expression.
          Expression in [0.05, 0.1]: Low expression.
          Expression in [0.1, 0.9]: Medium range.
          Expression in [0.9, 0.95]: High expression.
          Expression in [0.95, 1]: Very high expression.
        cond_formatting_rules:
          very_high:
            - s_eq: "Very high expression"
          high:
            - s_eq: "High expression"
          medium:
            - s_eq: "Medium range"
          low:
            - s_eq: "Low expression"
          very_low:
            - s_eq: "Very low expression"
      ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples)"
        description: |
          Ratio of samples in which the gene is not represented.
      ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples)"
        description: |
          Ratio of samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      ratio_zeros:
        title: "Ratio zero values"
        description: |
          Ratio of samples in which the gene has a zero value.
      rnaseq_ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples) [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene is not represented.
      rnaseq_ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples) [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      rnaseq_ratio_zeros:
        title: "Ratio zero values [RNA-seq only]"
        description: |
          Ratio of RNA-Seq samples in which the gene has a zero value.
      microarray_ratio_nulls_in_all_samples:
        title: "Ratio null values (all samples) [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene is not represented.
      microarray_ratio_nulls_in_valid_samples:
        title: "Ratio null values (valid samples) [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene is not represented, excluding samples with particularly low overall gene count.
      microarray_ratio_zeros:
        title: "Ratio zero values [Microarray only]"
        description: |
          Ratio of Microarray samples in which the gene has a zero value.

  expression_distributions_most_stable_genes:
    section_name: "Count distributions"
    file_format: "csv"
