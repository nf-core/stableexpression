name: Run nf-test
on:
  push:

env:
  NFT_VER: "0.9.5"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

jobs:
  nf-test:
    name: nf-test
    runs-on: local
    env:
      NXF_ANSI_LOG: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Get profile
        id: get_profile
        run: |
          if [ -z "${{ env.PROFILE }}" ]; then
            echo "Using default profile ${{ env.DEFAULT_PROFILE }}"
            echo "profile=${{ env.DEFAULT_PROFILE }}" >> $GITHUB_OUTPUT
          else
            echo "Using profile ${{ env.PROFILE }}"
            echo "profile=${{ env.PROFILE }}" >> $GITHUB_OUTPUT
          fi

      - name: Run nf-test
        id: run_nf_test
        uses: ./tests/act/actions/nf-test
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        env:
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
          NXF_VERSION: ${{ env.NXF_VER }}
        with:
          profile: ${{ steps.get_profile.outputs.profile }}
          args: ${{ env.ARGS }}
